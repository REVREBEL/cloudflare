name: IP Sync Worker CI
on:
  pull_request:
    paths:
      - 'apps/ip-sync-worker/**'
      - 'scripts/deploy-ip-sync.mjs'
      - 'config/sources.json'
      - '.github/workflows/ip-sync-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ip-sync-worker/**'
      - 'scripts/deploy-ip-sync.mjs'
      - 'config/sources.json'
      - '.github/workflows/ip-sync-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:deploy
      - run: npm run test --workspace @revrebel/ip-sync-worker
